name: Build frontend container

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "components/**"
      - "logos/**"
      - "public/**"
      - "services/**"
      - "App.tsx"
      - "constants.ts"
      - "index.css"
      - "index.html"
      - "index.tsx"
      - "metadata.json"
      - "package-lock.json"
      - "package.json"
      - "postcss.config.cjs"
      - "tailwind.config.cjs"
      - "tsconfig.json"
      - "types.ts"
      - "vite.config.ts"
      - ".dockerignore"
      - "Dockerfile.frontend"
      - "frontend-nginx.conf"
      - ".github/workflows/frontend-container.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/ecowing-frontend:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/ecowing-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=https://ecowing-backend.ashybush-5ee7e402.germanywestcentral.azurecontainerapps.io
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
